name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # dist/bundle.mjs is committed (the plugin runtime). Fail if a src change
      # left it stale — the build above just regenerated it.
      - name: Bundle freshness
        run: git diff --exit-code dist/bundle.mjs || { echo "::error::dist/bundle.mjs is stale — run pnpm build and commit it"; exit 1; }

  # engines.node is ">=20" but the test toolchain (Vitest 5) needs 22.12+, so the
  # suite above can never run on 20. dist/bundle.mjs is committed and fully
  # self-contained, so run the shipped artifact itself on the declared floor.
  runtime-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Shipped bundle starts and lists its tools on the engines floor
        env:
          SUMIT_CI_COMPANY_ID: "1"
          SUMIT_CI_API_KEY: not-a-real-key
          SUMIT_DEFAULT_ACCOUNT: ci
        run: |
          set -euo pipefail
          printf '%s\n%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node dist/bundle.mjs > out.jsonl
          count=$(tail -1 out.jsonl | jq '.result.tools | length')
          echo "node $(node -v): tools/list returned $count tools"
          if [ "$count" != "14" ]; then
            echo "::error::expected 14 tools on Node 20, got $count"; exit 1
          fi

  no-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block personal identifiers in skill payload
        run: |
          if grep -rniE 'benkalsky|דיגיטייזר|\b(Ben|Avi) [A-Z]' .claude/ src/ 2>/dev/null; then
            echo "::error::personal identifier found in payload"; exit 1
          fi
      - name: Block secret-shaped strings (API keys / tokens) in tracked files
        run: |
          if grep -rniE '(api[_-]?key|apikey)\s*[:=]\s*["'"'"']?[A-Za-z0-9]{16,}' src/ .claude/ 2>/dev/null \
             | grep -viE 'REPLACE_WITH|your-api-key|example|placeholder'; then
            echo "::error::possible hard-coded secret"; exit 1
          fi
